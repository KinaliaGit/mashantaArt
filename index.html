      <h1>Mashanta · Estudio de pintura, restauración y obra por encargo</h1>
      <p>
        Estudio de Mashanta, pintora y restauradora. Pintura y obra original única,
        retratos y obra por encargo (comisiones), restauración de óleos y
        cuadros antiguos, y talleres de pintura y acuarela en Ciudad de México.
      </p>
      <ul>
        <li>Obras: piezas originales únicas, disponibles ahora.</li>
        <li>Pedidos o comisiones: retrato al óleo por encargo, díptico, comisión familiar.</li>
        <li>Restauración de cuadros: limpieza, consolidación y reintegración cromática.</li>
        <li>Cursos y talleres: clases regulares de acuarela, curso de verano y curso de primavera.</li>
        <li>Visitas guiadas a museos, según la exposición vigente.</li>
        <li>Mi historia: de pasatiempo a oficio, entre la pintura y la restauración.</li>
      </ul>
      <p>Contacto por WhatsApp. Instagram: @mashanta.art</p>
